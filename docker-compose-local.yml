services:
  db:
    image: postgres
    volumes:
      - db:/var/lib/postgresql
    ports:
      - "127.0.0.1:5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
  https-portal:
    image: steveltn/https-portal:1
    ports:
      - '80:80'
      - '443:443'
    restart: always
    environment:
      DOMAINS: 'local.homepage'
      STAGE: 'local'
    volumes: 
      - ./https-portal-data:/var/lib/https-portal

volumes:
  db:
