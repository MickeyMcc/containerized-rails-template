services:
  db:
    image: postgres
    volumes:
      - db:/var/lib/postgresql
    environment:
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets:
      - postgres_password
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - app-data:/build
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "127.0.0.1:222:22"
    depends_on:
      - db
  https-portal:
    image: steveltn/https-portal:1
    ports:
      - '80:80'
      - '443:443'
    restart: always
    environment:
      DOMAINS: 'marsh-all.autonomous.rodeo -> http://web:3000' # unsure about this
      STAGE: 'production'
    volumes: 
      - ./https-portal-data:/var/lib/https-portal

secrets:
  postgres_password:
    file: secrets/postgres_password.txt

volumes:
  db:
  app-data:
