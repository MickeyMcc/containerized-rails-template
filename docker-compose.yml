services:
  db:
    image: postgres
    volumes:
      - db:/var/lib/postgresql
    environment:
      - POSTGRES_PASSWORD=password
    env_file:
      - .env
  web:
    build: .
    command: bash -c "rm -f tmp/pids/server.pid && bundle exec rails s -p 3000 -b '0.0.0.0'"
    volumes:
      - app-data:/build
    environment:
      - POSTGRES_PASSWORD=password
    env_file:
      - .env
    ports:
      - "3000:3000"
      - "127.0.0.1:222:22"
    depends_on:
      - db

volumes:
  db:
  app-data:
